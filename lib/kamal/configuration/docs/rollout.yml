# Rollout
#
# A rollout runs a second version of your app beside the live one and sends a
# slice of traffic to it.
#
# kamal-proxy picks the slice from the `kamal-rollout` cookie. Your app sets that
# cookie — the proxy never does, and a request without it always goes to the live
# version. Set it to something stable, such as an account id, so that
# `--percent 2` means two percent of accounts rather than two percent of requests.
#
# Rollouts are off until the config asks for them, and cost nothing until then.
# Declare this section, or a `rollout:` block on a role, to turn them on. Once on,
# roles behind the proxy take part by default — see `kamal docs role` to add other
# roles or leave one out.
#
#   kamal rollout boot            # boot the containers, no traffic yet
#   kamal rollout set --percent 2 # configure the split
#   kamal rollout disable         # off now, remembers the split
#   kamal rollout enable          # back on at the same split, no arguments
#   kamal rollout remove          # unregister and remove the containers
#
# `set` configures who is in the cohort. `enable` and `disable` decide whether
# that cohort reaches the rollout at all, so turning it off in a hurry takes no
# thought and turning it back on needs no arguments. `remove` ends the rollout.

rollout:

  # The highest percentage `kamal rollout set` accepts.
  #
  # Use it to hold yourself to a ramp. Defaults to 100.
  max_percent: 25

  # What a deploy does when a rollout is already live.
  #
  #   keep    - leave the rollout alone (default)
  #   ask     - ask before disabling it, and abort when there is no terminal
  #   disable - disable it without asking
  #
  # A rollout never expires on its own. With `keep`, deploying twice while one is
  # live leaves that cohort on an older version than everyone else, so Kamal
  # prints a notice on every deploy while a rollout is running.
  on_deploy: keep

  # What `kamal rollout boot` does to a rollout that is already enabled.
  #
  #   disable - turn it off, so enabling stays a separate step (default)
  #   keep    - leave it enabled, and let the new version take the same traffic
  on_boot: disable
