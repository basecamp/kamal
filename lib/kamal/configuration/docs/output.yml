# Output
#
# Configure where Kamal sends command output logs.

# Output options
#
# The options are specified under the output key in the configuration file.
output:

  # OTel
  #
  # Ship deploy logs to an OpenTelemetry-compatible endpoint via OTLP HTTP.
  #
  # Logs are sent as OTLP log records with resource attributes derived from
  # Kamal's deploy tags (service, version, performer, destination, etc.)
  otel:
    endpoint: http://otel-gateway:4318

  # File
  #
  # Write deploy logs to a file on the local machine.
  #
  # One log file is created per deploy, named with the timestamp and command.
  file:
    path: /var/log/kamal/

  # Console
  #
  # Replace the raw command firehose on the terminal with a condensed view: a
  # header panel, one section per deploy phase, a live status line per host,
  # and a summary panel. The raw output is suppressed on success and replayed
  # for any host that fails. Run with -v/--verbose to restore the full firehose.
  #
  # Both options are optional:
  #   spinner - show animated per-host spinners on a TTY (default: true)
  #   color   - force color on/off (default: auto-detect from the terminal)
  console:
    spinner: true
    color: true
