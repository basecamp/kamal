service: app
image: dhh/app
servers:
  web:
    hosts:
      - "1.1.1.1"
      - "1.1.1.2"
    rollout:
      options:
        memory: 2g
      env:
        clear:
          RAILS_ENV: rollout
  workers:
    hosts:
      - "1.1.1.3"
    cmd: bin/jobs
    rollout:
      hosts:
        - "1.1.1.4"
      cmd: bin/jobs --rollout
registry:
  username: user
  password: pw
builder:
  arch: amd64
rollout:
  max_percent: 25
