name: Docker

on:
  workflow_dispatch:
    inputs:
      tagInput:
        description: 'Tag'
        required: true
    
  release:
    types: [created]

permissions: {}

jobs:
  build-and-push-image:
    # Publishes only after a required reviewer approves (repo Settings > Environments).
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # GHCR_PUBLISH_TOKEN (classic PAT, write:packages, machine user) exists only in
          # the `release` environment. Once the release package's Actions access is locked
          # to read, this repository's GITHUB_TOKEN cannot push to it; until then the
          # fallback keeps releases working.
          username: ${{ secrets.GHCR_PUBLISH_TOKEN && vars.GHCR_PUBLISH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Determine version tag
        id: version-tag
        run: |
          INPUT_VALUE="${GITHUB_EVENT_INPUTS_TAGINPUT}"
          if [ -z "$INPUT_VALUE" ]; then
            INPUT_VALUE="${GITHUB_REF_NAME}"
          fi
          echo "value=$INPUT_VALUE" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_INPUTS_TAGINPUT: ${{ github.event.inputs.tagInput }}
      -
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/basecamp/kamal:latest
            ghcr.io/basecamp/kamal:${{ steps.version-tag.outputs.value }}
